# @package _global_
# XQC baseline on HalfCheetah-v4 with the paper's settings (1M env steps, UTD 2,
# 1M replay buffer, batch 256). Published: 12,528 +- 2,189 at 1M steps (10 seeds,
# published_results/xqc.csv). Launch with +experiment=halfcheetah_v4_baseline.
defaults:
  - override /env: HalfCheetah-v4

seed: 0
num_seeds: 1
max_steps: 1_000_000
eval_interval: 10_000
eval_episodes: 10
checkpoint_interval: 50_000
