# @package _global_
# XQC on HalfCheetah-v4, 10 seeds (0-9) trained together in one process, matching the
# paper's 10-seed evaluation. Same settings as halfcheetah_v4_baseline (1M env steps,
# UTD 2, batch 256, 1M replay buffer per seed). Published: 12,528 +- 2,189 at 1M steps
# (published_results/xqc.csv). Launch with +experiment=halfcheetah_v4_10seeds.
defaults:
  - override /env: HalfCheetah-v4

seed: 0
num_seeds: 10
max_steps: 1_000_000
eval_interval: 25_000
eval_episodes: 10
checkpoint_interval: 50_000
