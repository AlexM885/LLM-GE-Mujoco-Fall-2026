# @package _global_
# Short end-to-end test: a few thousand steps, frequent evals and checkpoints.
defaults:
  - override /env: HalfCheetah-v4

seed: 0
num_seeds: 1
max_steps: 6_000
start_training: 1_000
eval_interval: 1_000
eval_episodes: 2
log_interval: 1_000
checkpoint_interval: 1_000
replay_buffer_size: 10_000
