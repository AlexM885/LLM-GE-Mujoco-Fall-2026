# Small version of gym_walker2d.yaml for testing the pipeline locally.
max_iterations: 20
max_total_timesteps: 6000          # 3 candidates x 2000 steps
candidates_per_iteration: 2
checkpoint_interval: 1
log_level: "INFO"
random_seed: 42

environment:
  env_id: "Walker2d-v5"
  adapter_type: "gymnasium"
  context_file: "contexts/gym_walker2d.md"

training:
  total_timesteps: 2000
  total_timesteps_full: 2000
  num_seeds: 1
  eval_episodes_for_fitness: 2
  eval_max_steps: 1000
  seed: 42

interface:
  max_obs_dim: 512

evaluator:
  timeout: 600
  cascade_evaluation: false

llm:
  api_base: "http://localhost:8000/v1"
  model_name: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 0.7
  max_tokens: 4096

task_description: >
  Make the Walker2d robot walk forward (+x direction) as fast as possible
  without falling. Fitness is the environment's own episode return:
  forward velocity (1.0 * dx/dt) plus 1.0 for every step the robot stays
  healthy (torso height in (0.8, 2.0) and torso angle in (-1, 1)) minus
  0.001 * sum(action^2), summed over an episode of at most 1000 steps.
  The robot has two legs with 3 joints each (6 actuators total). The agent
  is trained with TD3 on your reward and observation, and ranked by the
  fitness above.
