[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limen"
version = "0.1.0"
description = "LIMEN — Discovering Reinforcement Learning Interfaces with Large Language Models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Akshat Singh Jaswal", email = "sja.akshat@gmail.com"},
    {name = "Ashish Baghel"},
    {name = "Paras Chopra"},
]
keywords = ["reinforcement-learning", "llm", "evolutionary-search", "reward-design", "observation-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "optax>=0.1.7",
    "distrax>=0.1.5",
    "pyyaml>=6.0",
    "dacite>=1.8.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "xminigrid>=0.9.0",
    "brax>=0.10.0",
    "ml-collections",
]

[project.urls]
Homepage = "https://github.com/lossfunk/limen"

[tool.setuptools.packages.find]
include = ["limen*"]
